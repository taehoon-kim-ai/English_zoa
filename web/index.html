<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhraseUp — Daily Business English</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root"></div>

  <!-- Self-hosted (web/vendor/, embedded in the Go binary): pinned versions,
       React production builds, no CDN dependency at runtime.
       react/react-dom 18.3.1 (production.min), @babel/standalone 7.29.0.
       ponytail: JSX is still transpiled in the browser on every page load
       (~110 KB via Babel standalone) — acceptable for an internal tool;
       the upgrade path is pre-transpiling with @babel/cli at deploy time. -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <script src="api.js"></script>
  <script type="text/babel" src="topbar.jsx"></script>
  <script type="text/babel" src="main.jsx"></script>
  <script type="text/babel" src="battle.jsx"></script>
  <script type="text/babel" src="quiz.jsx"></script>
  <script type="text/babel" src="translate.jsx"></script>
  <script type="text/babel" src="profile.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
